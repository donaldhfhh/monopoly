<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Monopoly Dice</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: #ffffff;
    min-height: 100vh;
}
header {
    width: 100%;
    padding: 20px;
    text-align: center;
    background: #050505;
    border-bottom: 1px solid #292929;
}
.logo {
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 4px;
}
.logo span {
    color: #d7b56d;
}
.hero {
    min-height: calc(100vh - 75px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 18px;
    background:
        radial-gradient(ellipse at top, #292929 0%, #080808 65%);
}
.card {
    width: 100%;
    max-width: 440px;
    text-align: center;
    padding: 25px 22px 35px;
    background: #111111;
    border: 1px solid #343434;
    border-radius: 22px;
    box-shadow: 0 20px 70px rgba(0,0,0,0.6);
}
.preview {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
    border-radius: 14px;
    margin-bottom: 28px;
    background: #222;
}
.badge {
    display: inline-block;
    color: #d7b56d;
    border: 1px solid #8e7443;
    padding: 7px 13px;
    border-radius: 30px;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 20px;
}
h1 {
    font-size: clamp(32px, 8vw, 43px);
    line-height: 1.15;
    font-weight: 900;
    margin-bottom: 16px;
    color: #ffffff;
}
h1 span {
    color: #d7b56d;
}
.description {
    font-size: 15px;
    color: #c5c5c5;
    line-height: 1.7;
    margin-bottom: 28px;
}
.continue-btn {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 58px;
    border-radius: 12px;
    background: #ffffff;
    color: #080808;
    text-decoration: none;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 2px;
    transition: 0.25s ease;
    box-shadow: 0 6px 25px rgba(255,255,255,0.10);
}
.continue-btn:hover {
    background: #d7b56d;
    transform: translateY(-3px);
}
.note {
    font-size: 11px;
    color: #888;
    margin-top: 18px;
}
footer {
    text-align: center;
    padding: 18px;
    font-size: 11px;
    color: #777;
    background: #050505;
}
@media (max-width: 380px) {
    .preview {
        height: 190px;
    }
    .card {
        padding: 20px 16px 28px;
    }
}
</style>
</head>
<body>
<header>
    <div class="logo">PREMIUM<span>+</span></div>
</header>
<main class="hero">
    <section class="card">
        <img
            class="preview"
            src="https://i.imgur.com/yFV1yml.jpeg"
            alt="Featured preview"
        >
        <div class="badge">EXCLUSIVE EXPERIENCE</div>
        <h1>
            DISCOVER<br>
            <span>SOMETHING</span><br>
            SPECIAL
        </h1>
        <p class="description">
            Ready to continue? Tap the button below to explore
            the next page.
        </p>
        <a
            class="continue-btn"
            href="https://monopolyrewards2026.blogspot.com/?m=1"
            target="_blank"
            rel="noopener noreferrer"
        >
            CONTINUE &nbsp; →
        </a>
        <p class="note">Please continue to the next page.</p>
    </section>
</main>
<footer>
    &copy; 2026 PREMIUM+ | All rights reserved.
</footer>
</body>
</html>
